[workspace]
resolver = "2"
members = [
    "crates/firstwatch-schema",
    "crates/firstwatch-watch",
    "crates/firstwatch-scan",
    "crates/firstwatch-match",
    "crates/firstwatch-mend",
    "crates/firstwatch-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/firstwatch-dev/firstwatch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
