[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "firstwatch"
description = "First eyes on upstream API changes. Python bindings for the firstwatch core."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dynamic = ["version"]

[tool.maturin]
manifest-path = "Cargo.toml"
