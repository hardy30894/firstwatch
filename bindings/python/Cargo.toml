[package]
name = "firstwatch-python"
description = "Python bindings for the firstwatch core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "firstwatch"
crate-type = ["cdylib"]

[dependencies]
firstwatch-schema = { path = "../../crates/firstwatch-schema" }
firstwatch-scan = { path = "../../crates/firstwatch-scan" }
firstwatch-match = { path = "../../crates/firstwatch-match" }
firstwatch-watch = { path = "../../crates/firstwatch-watch" }
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
