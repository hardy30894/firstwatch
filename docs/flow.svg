<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2da44e"/>
    </marker>
    <marker id="arroworange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="13" font-weight="600" fill="#57606a">UPSTREAM</text>
  <rect x="20" y="45" width="200" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="71" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">openapi spec diff</text>
  <text x="120" y="91" font-size="12" fill="#57606a" text-anchor="middle">firstwatch watch</text>

  <rect x="20" y="125" width="200" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="151" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">prose release notes</text>
  <text x="120" y="171" font-size="12" fill="#57606a" text-anchor="middle">firstwatch changelog</text>

  <text x="20" y="255" font-size="13" font-weight="600" fill="#57606a">YOUR CODE</text>
  <rect x="20" y="270" width="200" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="296" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">repo</text>
  <text x="120" y="316" font-size="12" fill="#57606a" text-anchor="middle">TypeScript, Python</text>

  <rect x="300" y="85" width="180" height="62" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="390" y="111" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">changefeed</text>
  <text x="390" y="131" font-size="12" fill="#57606a" text-anchor="middle">ChangeEvents, ndjson</text>

  <rect x="300" y="270" width="180" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="296" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">scan</text>
  <text x="390" y="316" font-size="12" fill="#57606a" text-anchor="middle">call sites, tree-sitter</text>

  <rect x="560" y="175" width="140" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="201" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">match</text>
  <text x="630" y="221" font-size="12" fill="#57606a" text-anchor="middle">who breaks, where</text>

  <rect x="770" y="155" width="170" height="102" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="855" y="180" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">mend</text>
  <text x="855" y="202" font-size="12" fill="#57606a" text-anchor="middle">1 deterministic rewrite</text>
  <text x="855" y="220" font-size="12" fill="#57606a" text-anchor="middle">2 provider recipe</text>
  <text x="855" y="238" font-size="12" fill="#8250df" text-anchor="middle">3 model synthesis (--llm)</text>

  <rect x="990" y="155" width="150" height="102" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
  <text x="1065" y="180" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">prove</text>
  <text x="1065" y="202" font-size="12" fill="#57606a" text-anchor="middle">staged copy</text>
  <text x="1065" y="220" font-size="12" fill="#57606a" text-anchor="middle">typecheck, tests</text>
  <text x="1065" y="238" font-size="12" fill="#57606a" text-anchor="middle">replay</text>

  <rect x="800" y="360" width="180" height="62" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
  <text x="890" y="386" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">applied, PR opened</text>
  <text x="890" y="406" font-size="12" fill="#57606a" text-anchor="middle">proof attached</text>

  <rect x="1000" y="360" width="150" height="62" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="1075" y="386" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">refused</text>
  <text x="1075" y="406" font-size="12" fill="#57606a" text-anchor="middle">with the reason</text>

  <line x1="220" y1="76" x2="292" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="156" x2="292" y2="127" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="301" x2="292" y2="301" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="116" x2="552" y2="192" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="301" x2="552" y2="222" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="700" y1="206" x2="762" y2="206" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="731" y="196" font-size="11" fill="#57606a" text-anchor="middle">impacts</text>

  <line x1="940" y1="206" x2="982" y2="206" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="961" y="196" font-size="11" fill="#57606a" text-anchor="middle">patches</text>

  <line x1="1035" y1="257" x2="920" y2="355" stroke="#2da44e" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
  <text x="950" y="300" font-size="11" fill="#2da44e" text-anchor="middle">proof passed</text>

  <line x1="1075" y1="257" x2="1075" y2="352" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arroworange)"/>
  <text x="1112" y="300" font-size="11" fill="#bc4c00" text-anchor="middle">cannot prove</text>
